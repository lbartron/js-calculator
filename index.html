<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>
    <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <title>Calculator</title>
</head>

<body>
    <div class = "calculator-container">
        <div class ="calculator-contents">
            <div class="calculator-display">
                <div id="result-window">0</div>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
                <md-filled-button onclick="appendToDisplay('7')">7</md-filled-button>
                <md-filled-button onclick="appendToDisplay('8')">8</md-filled-button>
                <md-filled-button onclick="appendToDisplay('9')">9</md-filled-button>
                <md-filled-tonal-button onclick="operatorClick('+')">+</md-filled-tonal-button>
                
                <md-filled-button onclick="appendToDisplay('4')">4</md-filled-button>
                <md-filled-button onclick="appendToDisplay('5')">5</md-filled-button>
                <md-filled-button onclick="appendToDisplay('6')">6</md-filled-button>
                <md-filled-tonal-button onclick="operatorClick('-')">-</md-filled-tonal-button>
                
                <md-filled-button onclick="appendToDisplay('1')">1</md-filled-button>
                <md-filled-button onclick="appendToDisplay('2')">2</md-filled-button>
                <md-filled-button onclick="appendToDisplay('3')">3</md-filled-button>
                <md-filled-tonal-button onclick="operatorClick('×')">x</md-filled-tonal-button>
                
                <md-filled-button style="--md-filled-button-container-color: #dc3545;" onclick="clearDisplay()">C</md-filled-button>
                <md-filled-button onclick="appendToDisplay('0')">0</md-filled-button>
                <md-filled-tonal-button onclick="calculateResult()">=</md-filled-tonal-button>
                <md-filled-tonal-button onclick="operatorClick('÷')">÷</md-filled-tonal-button>
            </div>
        </div>
    </div>
    <script src ="scripts.js"></script>
</body>
